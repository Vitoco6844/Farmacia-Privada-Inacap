<nav class="pagination" aria-label="Páginas"><span>Página {{ pagina.number }} de {{ pagina.paginator.num_pages }}</span>{% if pagina.has_previous %}<a class="button" href="?pagina={{ pagina.previous_page_number }}&amp;q={{ q|urlencode }}&amp;modulo={{ modulo|urlencode }}&amp;actor={{ actor|urlencode }}&amp;desde={{ desde }}&amp;hasta={{ hasta }}">Anterior</a>{% endif %}{% if pagina.has_next %}<a class="button" href="?pagina={{ pagina.next_page_number }}&amp;q={{ q|urlencode }}&amp;modulo={{ modulo|urlencode }}&amp;actor={{ actor|urlencode }}&amp;desde={{ desde }}&amp;hasta={{ hasta }}">Siguiente</a>{% endif %}</nav>
